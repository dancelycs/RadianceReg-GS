name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[evaluation,test]"
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
      - run: python reproduce.py
